{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
  <h2>Sign up</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/accounts/login/">Log in</a></p>
{% endblock %}
